
name: Build Portfolio Website

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build React Website
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Build
        run: npm run build
        env:
          VITE_PORTFOLIO_CHAT_WEBHOOK_URL: ${{ vars.VITE_PORTFOLIO_CHAT_WEBHOOK_URL }}
          VITE_PORTFOLIO_CHAT_CALLBACK_URL: ${{ vars.VITE_PORTFOLIO_CHAT_CALLBACK_URL }}
